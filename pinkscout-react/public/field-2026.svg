<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <!-- FRC 2026 REBUILT Field - Top-Down View -->
  
  <!-- Field Background (carpet) -->
  <rect width="1200" height="600" fill="#2d5016"/>
  
  <!-- Field Border -->
  <rect x="20" y="20" width="1160" height="560" fill="none" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Center Line -->
  <line x1="600" y1="20" x2="600" y2="580" stroke="#ffffff" stroke-width="2" stroke-dasharray="15,10"/>
  
  <!-- Red Alliance Zone (left side) -->
  <rect x="20" y="20" width="200" height="560" fill="rgba(229, 57, 53, 0.15)"/>
  <text x="120" y="310" font-size="24" fill="#e53935" text-anchor="middle" font-weight="bold">RED</text>
  
  <!-- Blue Alliance Zone (right side) -->
  <rect x="980" y="20" width="200" height="560" fill="rgba(30, 136, 229, 0.15)"/>
  <text x="1080" y="310" font-size="24" fill="#1e88e5" text-anchor="middle" font-weight="bold">BLUE</text>
  
  <!-- Red Hub 1 (upper left) -->
  <circle cx="150" cy="150" r="50" fill="none" stroke="#e53935" stroke-width="4"/>
  <text x="150" y="155" font-size="14" fill="#e53935" text-anchor="middle">Hub 1</text>
  
  <!-- Red Hub 2 (lower left) -->
  <circle cx="150" cy="450" r="50" fill="none" stroke="#e53935" stroke-width="4"/>
  <text x="150" y="455" font-size="14" fill="#e53935" text-anchor="middle">Hub 2</text>
  
  <!-- Blue Hub 1 (upper right) -->
  <circle cx="1050" cy="150" r="50" fill="none" stroke="#1e88e5" stroke-width="4"/>
  <text x="1050" y="155" font-size="14" fill="#1e88e5" text-anchor="middle">Hub 1</text>
  
  <!-- Blue Hub 2 (lower right) -->
  <circle cx="1050" cy="450" r="50" fill="none" stroke="#1e88e5" stroke-width="4"/>
  <text x="1050" y="455" font-size="14" fill="#1e88e5" text-anchor="middle">Hub 2</text>
  
  <!-- Red Tower (center-left) -->
  <rect x="350" y="250" width="80" height="100" fill="none" stroke="#e53935" stroke-width="3"/>
  <text x="390" y="290" font-size="12" fill="#e53935" text-anchor="middle">Tower</text>
  <text x="390" y="310" font-size="10" fill="#e53935" text-anchor="middle">L1 L2 L3</text>
  
  <!-- Blue Tower (center-right) -->
  <rect x="770" y="250" width="80" height="100" fill="none" stroke="#1e88e5" stroke-width="3"/>
  <text x="810" y="290" font-size="12" fill="#1e88e5" text-anchor="middle">Tower</text>
  <text x="810" y="310" font-size="10" fill="#1e88e5" text-anchor="middle">L1 L2 L3</text>
  
  <!-- Center Field Elements -->
  <circle cx="600" cy="300" r="40" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="600" y="305" font-size="12" fill="#ffffff" text-anchor="middle">Start</text>
  
  <!-- Fuel Loading Stations (corners) -->
  <rect x="20" y="20" width="60" height="60" fill="none" stroke="#ffab00" stroke-width="2"/>
  <text x="50" y="55" font-size="10" fill="#ffab00" text-anchor="middle">Fuel</text>
  
  <rect x="1120" y="20" width="60" height="60" fill="none" stroke="#ffab00" stroke-width="2"/>
  <text x="1150" y="55" font-size="10" fill="#ffab00" text-anchor="middle">Fuel</text>
  
  <rect x="20" y="520" width="60" height="60" fill="none" stroke="#ffab00" stroke-width="2"/>
  <text x="50" y="555" font-size="10" fill="#ffab00" text-anchor="middle">Fuel</text>
  
  <rect x="1120" y="520" width="60" height="60" fill="none" stroke="#ffab00" stroke-width="2"/>
  <text x="1150" y="555" font-size="10" fill="#ffab00" text-anchor="middle">Fuel</text>
  
  <!-- Starting Positions -->
  <circle cx="300" cy="100" r="20" fill="none" stroke="#e53935" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="300" cy="300" r="20" fill="none" stroke="#e53935" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="300" cy="500" r="20" fill="none" stroke="#e53935" stroke-width="2" stroke-dasharray="5,3"/>
  
  <circle cx="900" cy="100" r="20" fill="none" stroke="#1e88e5" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="900" cy="300" r="20" fill="none" stroke="#1e88e5" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="900" cy="500" r="20" fill="none" stroke="#1e88e5" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Title -->
  <text x="600" y="590" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.6">FRC 2026 REBUILT™ Field</text>
</svg>

