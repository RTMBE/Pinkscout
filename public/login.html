<!DOCTYPE html>
<!--
================================================================================
LOGIN.HTML - Authentication Page (PinkScout FRC Scouting App)
================================================================================

WHAT IS THIS PAGE?
This is the FIRST page any user sees if not authenticated. It handles:
- Sign In: Email + Password for existing users
- Sign Up: Email + Password + Confirm Password + Username + Sign-Up Code
  * The signup code must be exactly: "1551"
  * If code is incorrect, show a clear error message

USER PROFILE STORAGE:
On successful sign-up, we store the user profile in Firestore:
  users/{uid} = {
    email: string,
    displayName: string (username),
    role: "scouter" (default - admins set separately),
    createdAt: timestamp
  }

NO SIDEBAR:
This page doesn't have the sidebar because:
- It's a standalone auth page
- User isn't logged in yet
- Simple, focused design for login

AUTHENTICATION FLOW:
1. User enters credentials
2. Form submits to Firebase Auth
3. On success: Create/update user profile, redirect to dashboard.html
4. On error: Show friendly error message

================================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pinkscout</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!--
  ============================================================================
  AUTHENTICATION CONTAINER
  ============================================================================
  Centered container for the login card.
  Uses flexbox to center vertically and horizontally.
  ============================================================================
  -->
  <div class="auth-container">
    <div class="auth-card auth-card-large">

      <!-- Header with app branding -->
      <div class="auth-header">
        <h1>🤖 Pinkscout</h1>
        <p id="authSubtitle">Sign in to access your scouting dashboard</p>
      </div>

      <!--
      SUCCESS MESSAGE CONTAINER
      =========================
      Hidden by default, shown when signup succeeds.
      -->
      <div id="authSuccess" class="auth-success"></div>

      <!--
      ERROR MESSAGE CONTAINER
      =======================
      Hidden by default, shown when auth fails.
      The .show class makes it visible (see style.css).
      -->
      <div id="authError" class="auth-error"></div>

      <!--
      ========================================================================
      SIGN IN FORM
      ========================================================================
      Simple email/password form for existing users.
      ========================================================================
      -->
      <form id="signInForm" class="auth-form">
        <div class="form-group">
          <label for="signInEmail">Email Address</label>
          <input type="email" id="signInEmail" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="signInPassword">Password</label>
          <input type="password" id="signInPassword" name="password" required placeholder="Your password" minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="signInBtn">Sign In</button>
      </form>

      <!--
      ========================================================================
      SIGN UP FORM (hidden by default)
      ========================================================================
      Full registration form with:
      - Email
      - Password + Confirm Password
      - Username (displayName)
      - Sign-Up Code (must be "1551")
      ========================================================================
      -->
      <form id="signUpForm" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="signUpEmail">Email Address</label>
          <input type="email" id="signUpEmail" name="email" required placeholder="you@example.com">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="signUpPassword">Password</label>
            <input type="password" id="signUpPassword" name="password" required placeholder="Min 6 characters" minlength="6">
          </div>
          <div class="form-group">
            <label for="signUpConfirmPassword">Confirm Password</label>
            <input type="password" id="signUpConfirmPassword" name="confirmPassword" required placeholder="Confirm password" minlength="6">
          </div>
        </div>
        <div class="form-group">
          <label for="signUpUsername">Username (Display Name)</label>
          <input type="text" id="signUpUsername" name="username" required placeholder="Your scouter name" minlength="2" maxlength="30">
        </div>
        <div class="form-group">
          <label for="signUpCode">Sign-Up Code</label>
          <input type="text" id="signUpCode" name="signupCode" required placeholder="Enter team code">
          <small class="form-hint">Ask your team lead for the sign-up code</small>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="signUpBtn">Create Account</button>
      </form>

      <!-- Divider between form and switch link -->
      <div class="auth-divider">
        <span>or</span>
      </div>

      <!-- Toggle between Sign In and Sign Up modes -->
      <div class="auth-switch">
        <span id="authSwitchText">Don't have an account?</span>
        <a href="#" id="authSwitchLink">Create one</a>
      </div>

    </div>
  </div>

  <!--
  ============================================================================
  JAVASCRIPT - Authentication Logic
  ============================================================================

  FEATURES:
  1. Sign In with email/password
  2. Sign Up with email, password, confirm password, username, signup code
  3. Signup code validation (must be "1551")
  4. User profile creation in Firestore
  5. Redirect to dashboard on success

  ============================================================================
  -->
  <script type="module">
    // =========================================================================
    // IMPORTS
    // =========================================================================
    import { auth, db } from './js/firebase.js';
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      updateProfile,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import {
      doc,
      setDoc,
      getDoc,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    // =========================================================================
    // CONFIGURATION
    // =========================================================================

    /**
     * VALID SIGNUP CODE
     * -----------------
     * This is the secret code required to create a new account.
     * Change this value to restrict who can sign up.
     *
     * In a production app, you might want to:
     * - Store this in Firestore for easy updates
     * - Support multiple codes for different teams
     * - Set expiration dates on codes
     */
    const VALID_SIGNUP_CODE = '1551';

    // =========================================================================
    // DOM ELEMENT REFERENCES
    // =========================================================================

    // Forms
    const signInForm = document.getElementById('signInForm');
    const signUpForm = document.getElementById('signUpForm');

    // Sign In elements
    const signInEmail = document.getElementById('signInEmail');
    const signInPassword = document.getElementById('signInPassword');
    const signInBtn = document.getElementById('signInBtn');

    // Sign Up elements
    const signUpEmail = document.getElementById('signUpEmail');
    const signUpPassword = document.getElementById('signUpPassword');
    const signUpConfirmPassword = document.getElementById('signUpConfirmPassword');
    const signUpUsername = document.getElementById('signUpUsername');
    const signUpCode = document.getElementById('signUpCode');
    const signUpBtn = document.getElementById('signUpBtn');

    // Messages and toggles
    const authError = document.getElementById('authError');
    const authSuccess = document.getElementById('authSuccess');
    const authSubtitle = document.getElementById('authSubtitle');
    const switchLink = document.getElementById('authSwitchLink');
    const switchText = document.getElementById('authSwitchText');

    // =========================================================================
    // MODE TRACKING
    // =========================================================================
    let isLoginMode = true;

    // =========================================================================
    // AUTH STATE LISTENER
    // =========================================================================
    /**
     * Check if user is already logged in.
     * If so, redirect to dashboard immediately.
     */
    onAuthStateChanged(auth, (user) => {
      if (user) {
        console.log('✅ User already signed in, redirecting to dashboard');
        window.location.href = 'dashboard.html';
      }
    });

    // =========================================================================
    // TOGGLE BETWEEN SIGN IN / SIGN UP
    // =========================================================================
    switchLink.addEventListener('click', (e) => {
      e.preventDefault();
      isLoginMode = !isLoginMode;

      // Clear messages
      hideMessages();

      if (isLoginMode) {
        // Switch to Sign In mode
        signInForm.style.display = 'block';
        signUpForm.style.display = 'none';
        authSubtitle.textContent = 'Sign in to access your scouting dashboard';
        switchText.textContent = "Don't have an account?";
        switchLink.textContent = 'Create one';
      } else {
        // Switch to Sign Up mode
        signInForm.style.display = 'none';
        signUpForm.style.display = 'block';
        authSubtitle.textContent = 'Create a new account to start scouting';
        switchText.textContent = 'Already have an account?';
        switchLink.textContent = 'Sign in';
      }
    });

    // =========================================================================
    // HELPER FUNCTIONS
    // =========================================================================

    /**
     * Show error message to user
     */
    function showError(message) {
      authError.textContent = message;
      authError.classList.add('show');
      authSuccess.classList.remove('show');
    }

    /**
     * Show success message to user
     */
    function showSuccess(message) {
      authSuccess.textContent = message;
      authSuccess.classList.add('show');
      authError.classList.remove('show');
    }

    /**
     * Hide all messages
     */
    function hideMessages() {
      authError.classList.remove('show');
      authSuccess.classList.remove('show');
    }

    /**
     * Convert Firebase error codes to user-friendly messages
     */
    function getErrorMessage(error) {
      switch (error.code) {
        case 'auth/user-not-found':
          return 'No account found with this email.';
        case 'auth/wrong-password':
          return 'Incorrect password.';
        case 'auth/email-already-in-use':
          return 'An account with this email already exists.';
        case 'auth/weak-password':
          return 'Password should be at least 6 characters.';
        case 'auth/invalid-email':
          return 'Please enter a valid email address.';
        case 'auth/invalid-credential':
          return 'Invalid email or password.';
        case 'auth/too-many-requests':
          return 'Too many failed attempts. Please try again later.';
        default:
          return error.message || 'An error occurred. Please try again.';
      }
    }

    /**
     * CREATE USER PROFILE IN FIRESTORE
     * --------------------------------
     * Stores user data in Firestore under users/{uid}
     *
     * Schema:
     *   users/{uid} = {
     *     email: string,
     *     displayName: string,
     *     role: "scouter" (default),
     *     createdAt: timestamp
     *   }
     *
     * ROLES:
     * - "scouter" - Default role, can submit scouting data
     * - "admin" - Can access admin panel, managed separately
     *
     * To make a user an admin, add them to:
     *   settings/admins.emails[] array in Firestore
     */
    async function createUserProfile(user, displayName) {
      try {
        const userRef = doc(db, 'users', user.uid);

        // Check if profile already exists
        const existingProfile = await getDoc(userRef);
        if (existingProfile.exists()) {
          console.log('📋 User profile already exists');
          return;
        }

        // Create new user profile
        await setDoc(userRef, {
          email: user.email,
          displayName: displayName,
          role: 'scouter',  // Default role
          createdAt: serverTimestamp()
        });

        console.log('✅ User profile created in Firestore');
      } catch (error) {
        console.error('❌ Error creating user profile:', error);
        // Don't throw - user is created even if profile fails
      }
    }

    // =========================================================================
    // SIGN IN FORM HANDLER
    // =========================================================================
    signInForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email = signInEmail.value.trim();
      const password = signInPassword.value;

      // Disable button and show loading
      signInBtn.disabled = true;
      signInBtn.textContent = 'Signing in...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        console.log('✅ User signed in successfully');
        // onAuthStateChanged will handle the redirect

      } catch (error) {
        console.error('❌ Sign in error:', error);
        showError(getErrorMessage(error));
        signInBtn.disabled = false;
        signInBtn.textContent = 'Sign In';
      }
    });

    // =========================================================================
    // SIGN UP FORM HANDLER
    // =========================================================================
    signUpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email = signUpEmail.value.trim();
      const password = signUpPassword.value;
      const confirmPassword = signUpConfirmPassword.value;
      const username = signUpUsername.value.trim();
      const code = signUpCode.value.trim();

      // =====================================================================
      // VALIDATION
      // =====================================================================

      // Check passwords match
      if (password !== confirmPassword) {
        showError('Passwords do not match.');
        return;
      }

      // Check password length
      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      // Check username length
      if (username.length < 2) {
        showError('Username must be at least 2 characters.');
        return;
      }

      /**
       * SIGNUP CODE VALIDATION
       * ----------------------
       * The signup code must match exactly.
       * This prevents unauthorized users from creating accounts.
       */
      if (code !== VALID_SIGNUP_CODE) {
        showError('Invalid sign-up code. Please contact your team lead.');
        return;
      }

      // Disable button and show loading
      signUpBtn.disabled = true;
      signUpBtn.textContent = 'Creating account...';

      try {
        // Create the user account
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Update the user's display name in Firebase Auth
        await updateProfile(user, {
          displayName: username
        });

        // Create user profile in Firestore
        await createUserProfile(user, username);

        console.log('✅ Account created successfully');
        showSuccess('Account created! Redirecting...');

        // Short delay to show success message, then redirect
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);

      } catch (error) {
        console.error('❌ Sign up error:', error);
        showError(getErrorMessage(error));
        signUpBtn.disabled = false;
        signUpBtn.textContent = 'Create Account';
      }
    });

    // Log initialization
    console.log('🔐 Login page initialized');
  </script>

</body>
</html>
