<!DOCTYPE html>
<!--
================================================================================
NEWSCOUNTING.HTML - Match Scouting Form
================================================================================

WHAT IS THIS PAGE?
The scouting form for recording robot performance during FRC matches.
This is the main data entry point for scouters.

FORM SECTIONS:
1. Match Information - Who, what match, which team
2. Autonomous Period - First 15 seconds of match
3. Teleop Period - Driver-controlled period
4. Endgame - Final moments and climbing
5. Ratings - Subjective performance ratings
6. Notes - Free-form observations

FRC GAME ELEMENTS (2024 Crescendo):
- Speaker: The high goal (more points)
- Amp: The low goal (fewer points)
- Amplified: Bonus scoring when Amp is activated
- Climb: Robots can climb the stage at the end

FORM CONTROLS:
- Counter buttons: + and - buttons for counting scores
- Toggles: Yes/No checkboxes for boolean values
- Radio buttons: Rating scales (1-5)
- Dropdowns: Selection from options

================================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scouting - Pinkscout</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="app-container">

    <!--
    ========================================================================
    SIDEBAR NAVIGATION
    ========================================================================
    -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🤖 Pinkscout</h2>
        <span>FRC Scouting App</span>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="index.html">🏠 Home</a></li>
          <li><a href="dashboard.html">📊 Dashboard</a></li>
          <li><a href="admin.html">⚙️ Admin</a></li>
          <li><a href="newscounting.html" class="active">📝 Scouting</a></li>
        </ul>
      </nav>
      <!-- User Info - shown when logged in -->
      <div class="user-info" id="userInfo" style="display: none;">
        <div class="user-email" id="userEmail"></div>
        <button class="btn-logout" id="logoutBtn">Sign Out</button>
      </div>
    </aside>

    <!--
    ========================================================================
    MAIN CONTENT AREA
    ========================================================================
    -->
    <main class="main-content">

      <header class="page-header">
        <h1>Match Scouting</h1>
        <p>Record team performance data during matches.</p>
      </header>

      <!--
      ======================================================================
      SCOUTING FORM
      ======================================================================
      The main form element wraps all scouting sections.
      JavaScript in scouting.js handles form submission.
      ======================================================================
      -->
      <form id="scoutingForm" class="scouting-form">

        <!--
        ====================================================================
        SECTION 1: MATCH INFORMATION
        ====================================================================
        Basic info about this scouting entry.
        ====================================================================
        -->
        <div class="content-card">
          <h2>📋 Match Information</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="scouterName">Scouter Name</label>
              <input type="text" id="scouterName" name="scouterName" required placeholder="Your name">
            </div>
            <div class="form-group">
              <label for="matchNumber">Match Number</label>
              <input type="number" id="matchNumber" name="matchNumber" required min="1" placeholder="e.g. 1">
            </div>
            <div class="form-group">
              <label for="teamNumber">Team Number</label>
              <input type="number" id="teamNumber" name="teamNumber" required min="1" placeholder="e.g. 254">
            </div>
            <div class="form-group">
              <label for="allianceColor">Alliance Color</label>
              <select id="allianceColor" name="allianceColor" required>
                <option value="">Select...</option>
                <option value="red">🔴 Red Alliance</option>
                <option value="blue">🔵 Blue Alliance</option>
              </select>
            </div>
            <div class="form-group">
              <label for="startPosition">Starting Position</label>
              <select id="startPosition" name="startPosition" required>
                <option value="">Select...</option>
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
              </select>
            </div>
          </div>
        </div>

        <!--
        ====================================================================
        SECTION 2: AUTONOMOUS PERIOD
        ====================================================================
        The first 15 seconds of the match. Robot runs pre-programmed code.

        COUNTER BUTTONS EXPLAINED:
        - data-target="autoSpeaker" tells JavaScript which input to modify
        - readonly prevents manual typing (use buttons only)
        - type="button" prevents form submission when clicked
        ====================================================================
        -->
        <div class="content-card">
          <h2>🤖 Autonomous Period</h2>
          <div class="form-grid">
            <!-- Toggle: Did robot leave starting zone? -->
            <div class="form-group">
              <label>Left Starting Zone</label>
              <div class="toggle-group">
                <input type="checkbox" id="autoMobility" name="autoMobility">
                <label for="autoMobility" class="toggle-label">Yes</label>
              </div>
            </div>
            <!-- Counter: Notes scored in Speaker during auto -->
            <div class="form-group">
              <label>Auto Speaker Scored</label>
              <div class="counter-group">
                <button type="button" class="counter-btn minus" data-target="autoSpeaker">−</button>
                <input type="number" id="autoSpeaker" name="autoSpeaker" value="0" min="0" readonly>
                <button type="button" class="counter-btn plus" data-target="autoSpeaker">+</button>
              </div>
            </div>
            <!-- Counter: Notes scored in Amp during auto -->
            <div class="form-group">
              <label>Auto Amp Scored</label>
              <div class="counter-group">
                <button type="button" class="counter-btn minus" data-target="autoAmp">−</button>
                <input type="number" id="autoAmp" name="autoAmp" value="0" min="0" readonly>
                <button type="button" class="counter-btn plus" data-target="autoAmp">+</button>
              </div>
            </div>
            <!-- Counter: Missed shots during auto -->
            <div class="form-group">
              <label>Auto Notes Missed</label>
              <div class="counter-group">
                <button type="button" class="counter-btn minus" data-target="autoMissed">−</button>
                <input type="number" id="autoMissed" name="autoMissed" value="0" min="0" readonly>
                <button type="button" class="counter-btn plus" data-target="autoMissed">+</button>
              </div>
            </div>
          </div>
        </div>

        <!--
        ====================================================================
        SECTION 3: TELEOP PERIOD
        ====================================================================
        The driver-controlled period (~2 minutes).
        ====================================================================
        -->
        <div class="content-card">
          <h2>🎮 Teleop Period</h2>
          <div class="form-grid">
            <div class="form-group">
              <label>Teleop Speaker Scored</label>
              <div class="counter-group">
                <button type="button" class="counter-btn minus" data-target="teleopSpeaker">−</button>
                <input type="number" id="teleopSpeaker" name="teleopSpeaker" value="0" min="0" readonly>
                <button type="button" class="counter-btn plus" data-target="teleopSpeaker">+</button>
              </div>
            </div>
            <div class="form-group">
              <label>Teleop Amp Scored</label>
              <div class="counter-group">
                <button type="button" class="counter-btn minus" data-target="teleopAmp">−</button>
                <input type="number" id="teleopAmp" name="teleopAmp" value="0" min="0" readonly>
                <button type="button" class="counter-btn plus" data-target="teleopAmp">+</button>
              </div>
            </div>
            <div class="form-group">
              <label>Teleop Notes Missed</label>
              <div class="counter-group">
                <button type="button" class="counter-btn minus" data-target="teleopMissed">−</button>
                <input type="number" id="teleopMissed" name="teleopMissed" value="0" min="0" readonly>
                <button type="button" class="counter-btn plus" data-target="teleopMissed">+</button>
              </div>
            </div>
            <!-- Amplified: Bonus scoring when Amp is activated -->
            <div class="form-group">
              <label>Amplified Speaker Scored</label>
              <div class="counter-group">
                <button type="button" class="counter-btn minus" data-target="amplifiedScored">−</button>
                <input type="number" id="amplifiedScored" name="amplifiedScored" value="0" min="0" readonly>
                <button type="button" class="counter-btn plus" data-target="amplifiedScored">+</button>
              </div>
            </div>
            <div class="form-group">
              <label>Played Defense</label>
              <div class="toggle-group">
                <input type="checkbox" id="playedDefense" name="playedDefense">
                <label for="playedDefense" class="toggle-label">Yes</label>
              </div>
            </div>
            <div class="form-group">
              <label>Was Defended</label>
              <div class="toggle-group">
                <input type="checkbox" id="wasDefended" name="wasDefended">
                <label for="wasDefended" class="toggle-label">Yes</label>
              </div>
            </div>
          </div>
        </div>

        <!--
        ====================================================================
        SECTION 4: ENDGAME
        ====================================================================
        The last ~20 seconds. Robots attempt to climb the stage.

        CLIMB OPTIONS:
        - none: Didn't try to climb
        - parked: Stopped in the stage zone (some points)
        - failed: Tried but didn't succeed
        - climbed: Successfully hung on the chain
        - harmony: 2+ robots on same chain (bonus)
        ====================================================================
        -->
        <div class="content-card">
          <h2>🏁 Endgame</h2>
          <div class="form-grid">
            <div class="form-group">
              <label for="climbStatus">Climb Status</label>
              <select id="climbStatus" name="climbStatus" required>
                <option value="none">Did Not Attempt</option>
                <option value="parked">Parked</option>
                <option value="failed">Attempted - Failed</option>
                <option value="climbed">Climbed Successfully</option>
                <option value="harmony">Harmony (2+ robots)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Trap Scored</label>
              <div class="toggle-group">
                <input type="checkbox" id="trapScored" name="trapScored">
                <label for="trapScored" class="toggle-label">Yes</label>
              </div>
            </div>
            <div class="form-group">
              <label>Spotlit (on stage during climb)</label>
              <div class="toggle-group">
                <input type="checkbox" id="spotlit" name="spotlit">
                <label for="spotlit" class="toggle-label">Yes</label>
              </div>
            </div>
          </div>
        </div>

        <!--
        ====================================================================
        SECTION 5: PERFORMANCE RATINGS
        ====================================================================
        Subjective ratings based on scouter observation.

        RADIO BUTTONS:
        - Only one can be selected at a time (per group)
        - Same "name" attribute groups them together
        - "checked" sets the default value
        - full-width class makes the group span full container
        ====================================================================
        -->
        <div class="content-card">
          <h2>⭐ Performance Ratings</h2>
          <div class="form-grid">
            <div class="form-group full-width">
              <label for="driverSkill">Driver Skill (1-5)</label>
              <div class="rating-group">
                <input type="radio" name="driverSkill" value="1" id="driver1"><label for="driver1">1</label>
                <input type="radio" name="driverSkill" value="2" id="driver2"><label for="driver2">2</label>
                <input type="radio" name="driverSkill" value="3" id="driver3" checked><label for="driver3">3</label>
                <input type="radio" name="driverSkill" value="4" id="driver4"><label for="driver4">4</label>
                <input type="radio" name="driverSkill" value="5" id="driver5"><label for="driver5">5</label>
              </div>
            </div>
            <div class="form-group full-width">
              <label for="defenseRating">Defense Effectiveness (1-5)</label>
              <div class="rating-group">
                <input type="radio" name="defenseRating" value="1" id="defense1"><label for="defense1">1</label>
                <input type="radio" name="defenseRating" value="2" id="defense2"><label for="defense2">2</label>
                <input type="radio" name="defenseRating" value="3" id="defense3" checked><label for="defense3">3</label>
                <input type="radio" name="defenseRating" value="4" id="defense4"><label for="defense4">4</label>
                <input type="radio" name="defenseRating" value="5" id="defense5"><label for="defense5">5</label>
              </div>
            </div>
          </div>
        </div>

        <!--
        ====================================================================
        SECTION 6: NOTES & OBSERVATIONS
        ====================================================================
        Free-form text and important flags.
        ====================================================================
        -->
        <div class="content-card">
          <h2>📝 Notes & Observations</h2>
          <div class="form-group full-width">
            <label for="notes">Additional Notes</label>
            <!-- Textarea for multi-line text input -->
            <textarea id="notes" name="notes" rows="4" placeholder="Any observations about the robot, strategy, issues, etc."></textarea>
          </div>
          <div class="form-group">
            <label>Robot Died/Disabled</label>
            <div class="toggle-group">
              <input type="checkbox" id="robotDied" name="robotDied">
              <label for="robotDied" class="toggle-label">Yes</label>
            </div>
          </div>
          <div class="form-group">
            <label>Yellow/Red Card</label>
            <div class="toggle-group">
              <input type="checkbox" id="hadCard" name="hadCard">
              <label for="hadCard" class="toggle-label">Yes</label>
            </div>
          </div>
        </div>

        <!--
        ====================================================================
        SUBMIT SECTION
        ====================================================================
        Form actions and status display.

        BUTTON TYPES:
        - type="button": Does NOT submit form (used for Clear)
        - type="submit": Triggers form submission
        ====================================================================
        -->
        <div class="content-card">
          <div class="form-actions">
            <!-- Clear button - resets form without submitting -->
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear Form</button>
            <!-- Submit button - triggers form submission -->
            <button type="submit" class="btn btn-primary">Submit Scouting Data</button>
          </div>
          <!-- Status messages shown after submission -->
          <div id="submitStatus" class="submit-status"></div>
        </div>

      </form>
    </main>
  </div>

  <!--
  ============================================================================
  JAVASCRIPT MODULES
  ============================================================================
  Loading order matters:
  1. firebase.js - Firebase initialization
  2. app.js - Shared data functions
  3. scouting.js - Form handling and submission logic
  ============================================================================
  -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/scouting.js"></script>

  <script type="module">
    import { requireAuth, signOut, setupAuthListener } from './js/firebase.js';

    /*
     * REQUIRE AUTHENTICATION
     * Scouting requires login to prevent anonymous data entry.
     */
    requireAuth();

    /*
     * AUTH STATE LISTENER
     * Update UI when user state changes.
     */
    setupAuthListener(
      (user) => {
        document.getElementById('userInfo').style.display = 'block';
        document.getElementById('userEmail').textContent = user.email;
      }
    );

    /*
     * LOGOUT HANDLER
     */
    document.getElementById('logoutBtn').addEventListener('click', signOut);
  </script>

</body>
</html>
